apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  replicas: 1 # Keep at 1 to avoid race conditions when creating Git PRs
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: agent
        image: your-registry/aiops-tools:latest
        command: ["python", "ai_agent.py"] # Override command
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: openai-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: github-token