apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      imagePullSecrets:
        - name: gar-secret
      containers:
      - name: demo-app
        image: europe-west1-docker.pkg.dev/aiops88/aiops-repo/demo-app:latest
        env:
        - name: MYSQL_DB
          value: "mysql-db.default.svc.cluster.local" # Points to your existing MySQL DB
        - name: MYSQL_PASSWORD
          value: "root_password123"
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"